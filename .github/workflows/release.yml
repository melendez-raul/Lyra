name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            data: "src/lyra/frontend/assets:frontend/assets"
            flags: ""
          - os: windows-latest
            name: windows-x86_64
            data: "src/lyra/frontend/assets;frontend/assets"
            flags: "--windowed"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias del sistema
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - run: pip install pyinstaller -r requirements.txt

      - name: Build
        run: >
          pyinstaller --clean --onefile ${{ matrix.flags }}
          --name lyra
          --add-data "${{ matrix.data }}"
          src/lyra/main.py

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf lyra-${{ matrix.name }}.tar.gz -C dist lyra

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/lyra.exe -DestinationPath lyra-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lyra-${{ matrix.name }}
          path: lyra-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
